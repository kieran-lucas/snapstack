name: Build

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore app
        run: dotnet restore src/SnapStack/SnapStack.csproj -p:Platform=x64

      - name: Restore tests
        run: dotnet restore tests/SnapStack.Tests/SnapStack.Tests.csproj

      - name: Build app
        run: dotnet build src/SnapStack/SnapStack.csproj --configuration Release -p:Platform=x64 --no-restore

      - name: Test
        run: dotnet test tests/SnapStack.Tests/SnapStack.Tests.csproj --configuration Release --no-restore
