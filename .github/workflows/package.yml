name: Package

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Create test signing certificate
        shell: pwsh
        run: |
          $artifactRoot = Join-Path $env:GITHUB_WORKSPACE "artifacts"
          New-Item -ItemType Directory -Force -Path $artifactRoot | Out-Null

          $cert = New-SelfSignedCertificate `
            -Type Custom `
            -KeyUsage DigitalSignature `
            -Subject "CN=Kieran Lucas" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -TextExtension @(
              "2.5.29.37={text}1.3.6.1.5.5.7.3.3",
              "2.5.29.19={text}"
            ) `
            -FriendlyName "SnapStack CI Test Certificate"

          Export-Certificate `
            -Cert $cert `
            -FilePath (Join-Path $artifactRoot "SnapStack.Test.cer") | Out-Null

          "SNAPSTACK_CERT_THUMBPRINT=$($cert.Thumbprint)" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Restore
        run: dotnet restore src/SnapStack/SnapStack.csproj -p:Platform=x64

      - name: Build signed MSIX
        shell: pwsh
        run: |
          $packageDir = Join-Path $env:GITHUB_WORKSPACE "artifacts\package"

          dotnet build src/SnapStack/SnapStack.csproj `
            --configuration Release `
            -p:Platform=x64 `
            --no-restore `
            -p:GenerateAppxPackageOnBuild=true `
            -p:UapAppxPackageBuildMode=SideloadOnly `
            -p:AppxBundle=Never `
            -p:AppxPackageSigningEnabled=true `
            -p:PackageCertificateThumbprint="$env:SNAPSTACK_CERT_THUMBPRINT" `
            -p:AppxPackageDir="$packageDir"

      - name: Remove private signing key
        if: always()
        shell: pwsh
        run: |
          if ($env:SNAPSTACK_CERT_THUMBPRINT) {
            $certPath = "Cert:\CurrentUser\My\$env:SNAPSTACK_CERT_THUMBPRINT"
            if (Test-Path $certPath) {
              Remove-Item $certPath -Force
            }
          }

      - name: Upload test package
        uses: actions/upload-artifact@v4
        with:
          name: SnapStack-win-x64-test
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
